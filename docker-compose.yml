services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      READER_HOST: 0.0.0.0
    ports:
      - "${READER_BIND_ADDRESS:-127.0.0.1}:${READER_PORT:-8081}:${READER_PORT:-8081}"
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    volumes:
      - ./data:/app/data
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
