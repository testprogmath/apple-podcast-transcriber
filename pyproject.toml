[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-podcast-telegram-bot"
version = "0.2.0"
description = "Private Apple Podcasts to transcript Telegram bot"
requires-python = ">=3.12"
dependencies = ["python-telegram-bot>=22.5,<23", "httpx>=0.28,<0.29", "feedparser>=6.0.11,<7", "openai>=2,<3", "python-dotenv>=1,<2", "filelock>=3.16,<4", "pydantic>=2.13,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12"]

[tool.setuptools.packages.find]
include = ["podcast_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
