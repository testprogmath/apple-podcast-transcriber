version: 2
updates:
  # The uv ecosystem recompiles requirements.txt from requirements.in, so transitive
  # pins move with the dependencies that need them. The pip ecosystem only edited pins.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct
    groups:
      python-routine:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-routine:
        update-types: [minor, patch]
