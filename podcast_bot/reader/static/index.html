<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader</title>
<link rel="stylesheet" href="/reader/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header id="bar">
  <h1 id="title">Reader</h1>
  <div id="counters">
    <button id="hanly-counter" type="button" class="counter">Hanly · 0</button>
    <button id="mosaic-counter" type="button" class="counter">Mandarin Mosaic · 0</button>
  </div>
</header>

<main id="text" aria-busy="true">Loading…</main>

<div id="scrim" hidden></div>

<section id="basket" hidden aria-live="polite">
  <div id="basket-head">
    <h2 id="basket-title">Hanly</h2>
    <button id="basket-close" type="button" class="plain">Close</button>
  </div>
  <ul id="basket-items"></ul>
  <p id="basket-note"></p>
  <button id="basket-upload" type="button" class="primary">Upload</button>
</section>

<p id="toast" hidden></p>

<script src="/reader/app.js"></script>
</body>
</html>
