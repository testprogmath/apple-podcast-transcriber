<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader</title>
<link rel="stylesheet" href="/reader/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header id="bar">
  <div id="titlerow">
    <div id="titleblock">
      <p id="source-line"></p>
      <h1 id="title">Reader</h1>
    </div>
    <div id="toggles">
      <button id="pinyin-toggle" type="button" class="toggle" aria-pressed="false">拼音 OFF</button>
      <button id="language-toggle" type="button" class="toggle" aria-pressed="true">RU</button>
    </div>
  </div>
  <div id="counters">
    <button id="hanly-counter" type="button" class="counter hanly">Hanly · 0</button>
    <button id="mosaic-counter" type="button" class="counter mosaic">Mosaic · 0</button>
  </div>
</header>

<main id="text" aria-busy="true">Loading…</main>

<footer id="attribution">
  Dictionary data:
  <a id="cedict-link" href="https://www.mdbg.net/chinese/dictionary?page=cc-cedict">CC-CEDICT</a>,
  licensed <a id="cedict-licence" href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
</footer>

<div id="scrim" hidden></div>

<section id="lexeme" hidden role="dialog" aria-modal="true" aria-labelledby="lexeme-glyph">
  <div class="handle" aria-hidden="true"></div>
  <div id="lexeme-head">
    <div>
      <h2 id="lexeme-glyph"></h2>
      <p id="lexeme-pinyin"></p>
    </div>
    <button id="lexeme-close" type="button" class="icon" aria-label="Close">✕</button>
  </div>
  <p class="label" id="lexeme-senses-label" hidden>Значение</p>
  <ul id="lexeme-senses"></ul>
  <p class="label" id="lexeme-context-label" hidden>В контексте</p>
  <p id="lexeme-context"></p>
  <p id="lexeme-source"></p>
  <button id="lexeme-action" type="button" class="primary"></button>
</section>

<section id="basket" hidden role="dialog" aria-modal="true" aria-labelledby="basket-title">
  <div class="handle" aria-hidden="true"></div>
  <div id="basket-head">
    <h2 id="basket-title">Hanly</h2>
    <button id="basket-close" type="button" class="icon" aria-label="Close">✕</button>
  </div>
  <ul id="basket-items"></ul>
  <p id="basket-note"></p>
  <button id="basket-upload" type="button" class="primary">Upload</button>
</section>

<p id="toast" hidden role="status"></p>

<script src="/reader/app.js"></script>
</body>
</html>
